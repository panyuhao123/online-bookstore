# =====================================================================
# 本地开发 profile —— 存放真实数据库口令
# 本文件已被 .gitignore 忽略（*.local.yml），不会提交到代码库。
# 启动方式：命令行加 --spring.profiles.active=local
#          或 IDEA Run/Debug Configurations → Active profiles 填 local
# =====================================================================
spring:
  datasource:
    # 注意：Connector/J 8 不支持 characterEncoding=utf8mb4，必须写成 utf8
    url: jdbc:mysql://127.0.0.1:3306/bookstore?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: root
    password: "123456"

# 管理后台 vite 偶尔会因 5173 被占自动换到 5174，这里一并放行
# 5175/5176 是 uni-app H5（用户端 Web）的开发端口，与管理端分开避免端口争抢
bookstore:
  # 文件上传 —— 用绝对路径，避免 jar 启动 CWD 不同导致找不到 upload 目录
  upload:
    base-dir: "D:/workbuddy123/线上书店/bookstore-server/upload"

  # 高德开放平台 —— Web服务API（地理编码地址自动解析）
  # 密钥已在控制台申请；secret 用于数字签名（需在高德控制台「签名管理」单独开启），
  # 若未开启签名功能，把 secret 留空，代码自动降级为仅 key 模式（控制台需选择「key 安全模式」）
  gaode:
    key: "e4e3d72404e7f767f470d879b9608ad0"
    secret: ""           # 签名密钥，留空则自动降级为仅 key 模式
    base-url: "https://restapi.amap.com/v3/geocode"  # 地理编码 API 基址
    timeout-ms: 5000      # 单次请求超时
    rate-limit-seconds: 10  # 同一用户 10 秒内最多调用 1 次
    max-candidates: 5      # 多候选地址最多返回几条（防止刷接口）

  cors:
    allowed-origins:
      - http://localhost:5173
      - http://127.0.0.1:5173
      - http://localhost:5174
      - http://127.0.0.1:5174
      - http://localhost:5175
      - http://127.0.0.1:5175
      - http://localhost:5176
      - http://127.0.0.1:5176
